<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Min ukentlige matplan med oppskrifter, tilbud og handleliste.">
  <title>Matplan</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innhold</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="site-name" href="./">Matplan</a>
      <div class="header-actions">
        <button id="archive-toggle" class="week-picker" type="button" aria-expanded="false" aria-controls="archive-menu">Velg uke <span aria-hidden="true">⌄</span></button>
        <div id="archive-menu" class="archive-menu" hidden>
          <p class="archive-label">Ukeoversikt</p>
          <div id="archive-links"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="shell" id="main">
    <div class="overview">
      <h1 id="week-title">Ukens matplan</h1>
      <p class="period" id="period">Laster uke …</p>
      <div class="budget-summary">
        <div class="budget-line">
          <span>Handlebudsjett</span>
          <span><strong id="budget-actual">—</strong><span class="budget-target"> / <span id="budget-target">—</span></span></span>
        </div>
        <div class="budget-track" aria-hidden="true"><div id="budget-progress"></div></div>
        <p id="budget-note" class="small-note"></p>
      </div>
    </div>

    <nav class="page-nav" aria-label="Hopp til seksjon">
      <a href="#middager">Middager</a>
      <a href="#handleliste">Handleliste</a>
      <a href="#meal-prep">Meal prep</a>
      <a href="#tilbud">Tilbud</a>
    </nav>

    <section id="middager" class="section">
      <div class="section-heading">
        <h2>Middager</h2>
        <span class="section-meta">Trykk for oppskrift</span>
      </div>
      <div id="meal-list" class="meal-list" aria-live="polite"></div>
    </section>

    <section id="handleliste" class="section">
      <div class="section-heading">
        <h2>Handleliste</h2>
        <button type="button" id="reset-shopping" class="subtle-button">Nullstill</button>
      </div>
      <div class="shopping-summary">
        <span id="shopping-count">0 av 0 varer</span>
        <strong id="shopping-total">—</strong>
      </div>
      <div class="shopping-progress" aria-hidden="true"><div id="shopping-progress"></div></div>
      <div id="shopping-groups"></div>
      <p id="pantry-note" class="detail-note"></p>
    </section>

    <section id="meal-prep" class="section">
      <div class="section-heading">
        <h2>Meal prep</h2>
        <span class="section-meta">Ca. 1 time mandag</span>
      </div>
      <ol id="prep-steps" class="prep-steps"></ol>
      <p id="storage-note" class="detail-note"></p>
    </section>

    <section id="tilbud" class="section">
      <div class="section-heading"><h2>Ukens tilbud</h2></div>
      <p id="offer-summary" class="section-intro"></p>
      <div id="offer-list" class="offer-list"></div>
      <h3 class="sub-heading">Kundeaviser</h3>
      <div id="flyer-links" class="flyer-links"></div>
      <p id="offer-disclaimer" class="detail-note"></p>
    </section>

    <section id="other-meals" class="section last-section">
      <div class="section-heading"><h2>Frokost og lunsj</h2></div>
      <div id="other-meals-list"></div>
    </section>
  </main>
</body>
</html>
